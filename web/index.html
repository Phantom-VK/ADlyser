<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADlyser skeleton player</title>
  </head>
  <body>
    <div id="stage" style="position: relative; width: 960px; max-width: 100%">
      <video id="content" class="video-js" controls preload="auto" width="960" height="540"></video>
      <video
        id="ad"
        playsinline
        style="display: none; position: absolute; inset: 0; width: 100%; height: 100%; background: #000; z-index: 10"
      ></video>
      <div
        id="pill"
        style="display: none; position: absolute; top: 8px; left: 8px; z-index: 11; background: rgba(0, 0, 0, 0.7); color: #fff; padding: 2px 8px; font: 14px sans-serif"
      ></div>
    </div>
    <p id="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
