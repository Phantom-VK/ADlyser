# All tunables live here. Override any value with ADLYSER_<SECTION>__<KEY> env vars or in .env.

videos_dir: /home/vikramaditya/Downloads/hackathon_contents-20260926T060049Z-1-001/hackathon_contents
data_dir: data
cache_dir: data/cache

llm:
  temperature: 0   # every call; the disk cache stays valid only if answers are stable
  concurrency: 8
  timeout_s: 120
  vision:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-flash
    image_detail: low
  text:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-flash   # normaliser + rerank; deepseek-v4-pro is the slower alternative

transcribe:
  enabled: true    # optional context only; nothing downstream may require it
  provider: groq   # groq = hosted whisper (GROQ_API_KEY in .env); local = faster-whisper
  model: whisper-large-v3
  language: bn
  chunk_s: 600
  chunk_min_s: 30
  max_chunk_mb: 24
  max_no_speech_prob: 0.5
  min_overlap_s: 0.2
  request_timeout_s: 120
  retry_attempts: 3
  retry_max_wait_s: 3900
  retry_default_wait_s: 60
  # local provider only
  clip_merge_gap_s: 1.0
  model_size: small
  device: cpu
  compute_type: int8
  beam_size: 1

vad:
  threshold: 0.35   # 0.5 gave 19 candidates on feluda; 0.35 gives 19 too and detects more speech
  min_speech_ms: 100
  min_silence_ms: 100
  speech_pad_ms: 100

cuts:
  adaptive_threshold: 3.0
  min_scene_len_frames: 8
  black_min_duration_s: 0.1
  black_pixel_threshold: 0.1
  black_scale_width: 320

candidates:
  min_silence_s: 0.8
  speech_guard_s: 0.4
  skip_start_s: 180
  skip_end_s: 120
  skip_start_fraction: 0.15   # short videos: skip min(skip_start_s, fraction x duration)
  skip_end_fraction: 0.1
  min_spacing_s: 20
  max_candidates: 60
  allow_long_silence_without_cut: false
  long_silence_s: 2.0
  titles_scan_fraction: 0.25   # opening/closing titles are looked for in the first/last quarter ...
  titles_max_s: 480            # ... and never more than 8 minutes in

pacing:
  max_breaks_per_hour: 6
  min_gap_s: 300
  ad_duration_s: 30
  max_ad_load_pct: 12
  min_duration_for_break_s: 90   # from this length up, at least one break is allowed whatever the caps round to
  min_break_score: 0.5   # a break below this is not warranted, whatever the caps allow

frames:
  width: 640
  jpeg_quality: 5   # ffmpeg -q:v, lower is better

stretch:
  frame_interval_s: 30   # about one frame per this many seconds of a stretch
  min_frames: 3
  max_frames: 8
  tool_rounds: 2   # look_closer rounds per stretch; 0 = single call

boundary:
  frame_offsets_s: [2.0, 0.5]   # frames this far before and after the cut

scenes:
  min_confidence: 0.5   # below this a stretch is "unknown" and blocks every brand

catalogue:
  path: catalogue/brands.json                 # the seed catalogue, in any format
  added_path: data/catalogue/added.json       # brands added from the UI (raw records)
  working_path: data/catalogue/working.json   # seed + added, what a run reads
  default_negative_tags: [death_grief, funeral_ritual, sexual_content]   # every brand honours these, so a brand with no negatives is never a wildcard

api:
  uploads_dir: data/uploads
  upload_max_mb: 500
  upload_suffixes: [.mp4, .mov, .mkv]
  frame_step_s: 0.5     # thumbnail times snap to this grid so the thumbnail cache stays small
  large_frame_width: 1280   # width of the hero image (size=large); thumbnails use frames.width
  events_poll_s: 0.2    # how often a progress stream looks for new events

matcher:
  embed_model: BAAI/bge-m3
  shortlist_k: 5   # embedding shortlist size
  top_k: 3         # kept after the rerank
  min_fit: 0.4     # best eligible fit below this: no brand here, pacing tries the next-best break
  max_per_brand: 1   # a brand already used in the episode is skipped if another unblocked brand has fit >= min_fit

reviewer:
  sweep_interval_s: 10   # one sweep frame per this many seconds of the scene
  sweep_max_frames: 40
  tool_rounds: 3
  speech_window_s: 15
  max_loops: 2           # veto loops back to the matcher or the pacing solver

creatives:
  duration_s: 10
  width: 960
  height: 540
  font: DejaVu Sans   # any fontconfig family
  promo_title: Your story continues shortly
  promo_subtitle: Ad break
